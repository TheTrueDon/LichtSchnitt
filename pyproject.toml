[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lichtschnitt"
version = "0.0.2"
description = "Ubuntu-Anwendung zum Entwerfen und Steuern von CNC-Laseraufträgen"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LichtSchnitt-Projekt" }]
dependencies = []

[project.scripts]
lichtschnitt = "lichtschnitt.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
lichtschnitt = ["profiles/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
